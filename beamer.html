<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- iPad/iPhone: vom Home-Bildschirm aus ohne Browserleisten (Vollbild-Ersatz) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Wer stiehlt uns die Show – Beamer</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="beamer-page">
  <div class="studio-bg" id="studio-bg" aria-hidden="true"></div>
  <main class="beamer"><div class="stage" id="stage"></div></main>
  <div class="beamer-controls" id="beamer-controls">
    <button id="fullscreen" class="btn small pink" type="button" title="Vollbild (Taste F)">⛶ Vollbild</button>
    <button id="sound-on" class="btn small ghost" type="button">🔊 Ton aktivieren</button>
  </div>

  <script type="module">
    import { h, connect, mediaUrl, coinImg } from './assets/js/client.js';
    import { renderGame } from './assets/js/beamer-play.js';
    import { answerContent } from './assets/js/ink.js';
    import { podiumRow, INTRO_START, INTRO_STEP, pultLayers, singlePodium, PULT } from './assets/js/studio.js';
    import { startPause, stopPause, bandScene, audioReady } from './assets/js/band.js';

    const stage = document.getElementById('stage');
    const embedded = new URLSearchParams(location.search).has('preview');
    let lastEffect = null;
    let lastKey = null;
    let titleTimer = null;
    let audio = null;
    let clockOffset = 0;
    let lastState = null;

    setInterval(() => {
      for (const el of document.querySelectorAll('[data-deadline]')) {
        el.textContent = `${Math.max(0, Math.ceil((Number(el.dataset.deadline) - (Date.now() + clockOffset)) / 1000))} s`;
      }
    }, 250);

    // Eigene, synthetisch erzeugte Effekte – keine fremde Musik.
    function enableSound() {
      if (audio) return;
      audio = new AudioContext();
      document.getElementById('sound-on')?.remove();
      // Läuft gerade die Pause, setzt die Musik jetzt ein.
      if (lastState && lastState.view === 'pause' && lastState.settings.sound) startPause(audio, lastState.pauseSongs || []);
      // Ein laufendes Intro-Video bekommt jetzt Ton.
      const v = document.querySelector('video.intro-video');
      if (v) v.muted = false;
    }
    document.getElementById('sound-on').onclick = enableSound;

    // ---------- Vollbild für Leinwand/Beamer ----------
    // Ein Klick startet Vollbild und Ton zugleich (Browser erlauben beides nur nach einer Nutzeraktion).
    const root = document.documentElement;
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
    const canFullscreen = !!(root.requestFullscreen || root.webkitRequestFullscreen);
    let wakeLock = null;
    async function keepAwake(on) {
      try {
        if (on && 'wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => (wakeLock = null));
        } else if (!on && wakeLock) {
          await wakeLock.release();
        }
      } catch {
        // Nicht unterstützt oder abgelehnt – dann eben ohne.
      }
    }
    // Im Prototyp (eingebettet) übernimmt die Übersichtsseite das Vollbild.
    const inPrototype = window.parent !== window && (window.name === 'quiz-proto' || typeof __search !== 'undefined');
    async function toggleFullscreen() {
      enableSound();
      if (inPrototype) {
        window.parent.postMessage({ quiz: true, op: 'beamer-fullscreen' }, '*');
        return;
      }
      if (fsElement()) {
        await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
      if (!canFullscreen) {
        alertNoFullscreen();
        return;
      }
      try {
        await (root.requestFullscreen ? root.requestFullscreen({ navigationUI: 'hide' }) : root.webkitRequestFullscreen());
      } catch {
        alertNoFullscreen();
      }
    }
    function alertNoFullscreen() {
      const box = h('div', { class: 'fs-hint', role: 'alert' },
        h('b', {}, 'Vollbild wird von diesem Browser nicht unterstützt.'),
        h('p', {}, 'iPhone/iPad: Teilen → „Zum Home-Bildschirm“ und den Beamer von dort öffnen – dann läuft er ohne Browserleisten. ',
          'Oder Bildschirmsynchronisierung bzw. AirPlay/Chromecast auf die Leinwand nutzen.'),
        h('button', { class: 'btn small', type: 'button', onclick: () => box.remove() }, 'OK'));
      document.body.append(box);
    }
    function onFullscreenChange() {
      const on = !!fsElement();
      document.body.classList.toggle('is-fullscreen', on);
      document.getElementById('fullscreen').textContent = on ? '✕ Vollbild beenden' : '⛶ Vollbild';
      keepAwake(on);
      showControls();
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && fsElement()) keepAwake(true); });
    document.getElementById('fullscreen').onclick = toggleFullscreen;
    document.addEventListener('dblclick', toggleFullscreen);
    document.addEventListener('keydown', (ev) => {
      if ((ev.key === 'f' || ev.key === 'F') && !ev.ctrlKey && !ev.metaKey && !ev.altKey) toggleFullscreen();
    });
    // Bedienelemente und Mauszeiger blenden sich nach kurzer Zeit aus.
    let idleTimer = null;
    function showControls() {
      document.body.classList.remove('is-idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('is-idle'), fsElement() ? 2500 : 8000);
    }
    for (const ev of ['mousemove', 'pointerdown', 'keydown', 'touchstart']) document.addEventListener(ev, showControls, { passive: true });
    showControls();
    if (embedded) document.getElementById('beamer-controls').remove();

    function tone(freqs, dur = 0.18, type = 'square') {
      if (!audio) return;
      let t = audio.currentTime;
      for (const f of freqs) {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = type;
        o.frequency.value = f;
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(audio.destination);
        o.start(t);
        o.stop(t + dur);
        t += dur * 0.8;
      }
    }
    const SOUNDS = {
      correct: () => tone([660, 880, 1320], 0.16, 'triangle'),
      wrong: () => tone([220, 160], 0.3, 'sawtooth'),
      buzz: () => tone([520], 0.35, 'square'),
      reveal: () => tone([392, 494, 587, 784], 0.2, 'triangle'),
      coin: () => tone([523, 659, 784, 1047, 1319], 0.22, 'triangle'),
      title: () => tone([392, 392, 523, 659, 523, 784], 0.2, 'square'),
    };

    connect({
      hello: () => ({ role: 'beamer', preview: embedded }),
      quiet: embedded,
      onState: (s, serverTime) => {
        if (serverTime) clockOffset = serverTime - Date.now();
        render(s);
      },
    });

    function teamOf(s, id) {
      return s.teams.find((t) => t.id === id) || { name: '?', color: '#888' };
    }

    function render(s) {
      document.documentElement.classList.toggle('reduced-motion', !!s.settings.reducedMotion);
      document.title = `${s.show.name} – Beamer`;
      const fresh = lastEffect !== null && s.effect.seq !== lastEffect;
      if (fresh && s.settings.sound && !embedded) SOUNDS[s.effect.kind]?.();
      lastEffect = s.effect.seq;

      const key = JSON.stringify([s.view, s.gameView, s.ranking, s.coin, s.show, s.teams, s.game, s.games, s.pauseSongs, s.introVideo, s.coins, s.finale]);
      const replayTitle = fresh && (s.effect.kind === 'title' || s.effect.kind === 'video');
      if (key === lastKey && !replayTitle) return;
      lastKey = key;
      clearTimeout(titleTimer);

      lastState = s;
      // Pausenmusik nur in der Pause; beim Verlassen ausblenden.
      if (s.view !== 'pause') stopPause();
      const views = { start, video, intro, pyramid, title, game, ranking, coin, pause, finale, blank: () => [] };
      if (s.view !== 'finale') prevFin = null;
      stage.replaceChildren(...(views[s.view] || start)(s, replayTitle));
    }

    // ---- Neon-Studiobühne als Hintergrund (SVG, skaliert mit dem Bildschirm) ----
    (function studio() {
      const W = 1600, H = 900;
      const tri = (x, y, size, dim) => `<polygon class="tri${dim ? ' dim' : ''}" points="${x},${y - size * 0.58} ${x + size / 2},${y + size * 0.29} ${x - size / 2},${y + size * 0.29}"/>`;
      let tris = '';
      const rows = [[150, 6], [250, 6], [350, 5], [450, 3], [550, 1]];
      rows.forEach(([y, n], r) => {
        for (let i = 0; i < n; i++) {
          const x = 120 + i * 92 + r * 18;
          const size = 58 - r * 2;
          tris += tri(x, y, size, (i + r) % 3 === 2) + tri(W - x, y, size, (i + r) % 3 === 1);
        }
      });
      const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe8ff" stop-opacity="0.55"/><stop offset="1" stop-color="#1fd6f2" stop-opacity="0"/></linearGradient>
          <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2d8a" stop-opacity="0"/><stop offset="0.5" stop-color="#ff2d8a" stop-opacity="0.18"/><stop offset="1" stop-color="#1fd6f2" stop-opacity="0.12"/></linearGradient>
        </defs>
        <polygon class="spot" points="330,0 370,0 560,700 140,700"/>
        <polygon class="spot" points="${W - 370},0 ${W - 330},0 ${W - 140},700 ${W - 560},700"/>
        <polygon class="spot" points="640,0 660,0 760,560 540,560" opacity="0.5"/>
        <polygon class="spot" points="${W - 660},0 ${W - 640},0 ${W - 540},560 ${W - 760},560" opacity="0.5"/>
        <g>${tris}</g>
        <polygon class="beam-pink" points="0,40 34,40 300,640 262,640"/>
        <polygon class="beam-cyan" points="0,250 24,250 220,700 194,700" opacity="0.9"/>
        <polygon class="beam-pink" points="${W},40 ${W - 34},40 ${W - 300},640 ${W - 262},640"/>
        <polygon class="beam-cyan" points="${W},250 ${W - 24},250 ${W - 220},700 ${W - 194},700" opacity="0.9"/>
        <rect x="0" y="640" width="${W}" height="${H - 640}" fill="url(#floor)"/>
        <ellipse class="floor-line" cx="800" cy="905" rx="980" ry="150" stroke="#ff2d8a"/>
        <ellipse class="floor-line" cx="800" cy="905" rx="820" ry="95" stroke="#1fd6f2"/>
        <ellipse class="floor-line" cx="800" cy="660" rx="700" ry="18" stroke="#1fd6f2" opacity="0.7"/>
      </svg>`;
      document.getElementById('studio-bg').innerHTML = svg;
    })();

    // Show-Logo: Wörter gestapelt, „uns“ hervorgehoben.
    function showLogo(name, small) {
      const words = String(name || '').trim().split(/\s+/).filter(Boolean);
      return h('div', { class: `show-logo${small ? ' small' : ''}`, role: 'heading', 'aria-level': '1', 'aria-label': name },
        words.map((w, i) => h('span', { class: /^uns$/i.test(w) ? 'hot' : '', style: { animationDelay: `${i * 0.12}s` } }, w)));
    }

    // Gewinnstufe zur Münzposition (nach Spiel 4, 6, 8).
    const STAGE_OF = { 4: 1, 6: 2, 8: 3 };

    function start(s) {
      return [
        showLogo(s.show.name),
        s.show.subtitle ? h('div', { class: 'sub', style: { marginTop: '3vh' } }, s.show.subtitle) : '',
      ];
    }

    // Teampulte (gezeichnet), Avatar im Bogen. Punkte nur, wenn opts.points (Münzvergabe).
    function teamsScene(s, opts = {}) {
      return podiumRow(s.teams, { coins: s.coins || [], ...opts });
    }

    // Die drei Münzen vor der Moderatorin (Positionen im 938x530-Pultbild).
    const PULT_COINS = [[485.5, 287.5], [518.5, 287.5], [550.5, 287]];

    function intro(s) {
      return [
        h('div', { class: 'kicker' }, 'Willkommen bei'),
        h('div', { style: { margin: '1vh 0 2.5vh' } }, showLogo(s.show.name, true)),
        teamsScene(s, { intro: true }),
        h('div', { class: 'sub intro-host', style: { marginTop: '2.5vh' }, '--d': `${INTRO_START + Math.min(s.teams.length, 6) * INTRO_STEP}s` }, `Moderation: ${s.show.host}${s.show.coHost ? ` & ${s.show.coHost}` : ''}`),
      ];
    }

    // Übersicht Kategorien (4-2-2): Kategorien 1–4, Gewinnstufe 1, Kategorien 5–6,
    // Gewinnstufe 2, Kategorien 7–8, Gewinnstufe 3, ganz oben das Finale.
    function pyramid(s) {
      const NS = 'http://www.w3.org/2000/svg';
      const el = (tag, attrs, text) => {
        const n = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
        if (text !== undefined) n.textContent = text;
        return n;
      };
      const W = 1000, apexY = 0, baseY = 880, baseHalf = 430, gap = 6;
      const half = (y) => baseHalf * ((y - apexY) / (baseY - apexY));
      // Bänder von oben nach unten: [Art, Beschriftung, Höhe]
      const bands = [
        ['finale', 'FINALE', 250],
        ['k3', 'KATEGORIE 8', 50], ['k3', 'KATEGORIE 7', 50],
        ['stage', 'GEWINNSTUFE 3', 48],
        ['k2', 'KATEGORIE 6', 60], ['k2', 'KATEGORIE 5', 60],
        ['stage', 'GEWINNSTUFE 2', 48],
        ['k1', 'KATEGORIE 4', 50], ['k1', 'KATEGORIE 3', 50], ['k1', 'KATEGORIE 2', 50], ['k1', 'KATEGORIE 1', 50],
        ['stage', 'GEWINNSTUFE 1', 48],
      ];
      const total = bands.reduce((a, b) => a + b[2], 0) + gap * (bands.length - 1);
      const scale = (baseY - apexY) / total;
      const svg = el('svg', { viewBox: `-40 -10 ${W + 80} ${baseY + 30}`, role: 'img', 'aria-label': 'Übersicht Kategorien bis zum Finale' });
      const defs = el('defs', {});
      const grad = (id, stops) => {
        const g = el('linearGradient', { id, x1: 0, y1: 0, x2: 0, y2: 1 });
        stops.forEach(([o, c]) => g.append(el('stop', { offset: o, 'stop-color': c })));
        defs.append(g);
      };
      grad('g-finale', [[0, '#f0b45a'], [0.55, '#c9802c'], [1, '#8f5317']]);
      grad('g-k3', [[0, '#b9d2e8'], [1, '#86a6c4']]);
      grad('g-k2', [[0, '#7a848f'], [1, '#55606b']]);
      grad('g-k1', [[0, '#5b7287'], [1, '#3f5367']]);
      grad('g-stage', [[0, '#ffffff'], [0.5, '#e9e9ee'], [1, '#cfd0d8']]);
      svg.append(defs);
      const current = s.game ? s.game.position : null;
      let y = apexY;
      const order = [];
      bands.forEach((b, idx) => {
        const hgt = b[2] * scale;
        const y0 = y, y1 = y + hgt;
        const ext = b[0] === 'stage' ? 26 : 0;
        const h0 = b[0] === 'finale' ? 0 : half(y0) + ext, h1 = half(y1) + ext;
        const pts = `${W / 2 - h0},${y0} ${W / 2 + h0},${y0} ${W / 2 + h1},${y1} ${W / 2 - h1},${y1}`;
        const g = el('g', { class: 'pyr-band' });
        const num = /KATEGORIE (\d)/.exec(b[1]);
        if (num && Number(num[1]) === current) g.setAttribute('class', 'pyr-band pyr-current');
        const isCurrent = num && Number(num[1]) === current;
        g.append(el('polygon', isCurrent
          ? { points: pts, fill: `url(#g-${b[0]})`, stroke: '#ff2d8a', 'stroke-width': 7, 'stroke-linejoin': 'round' }
          : { points: pts, fill: `url(#g-${b[0]})` }));
        if (b[0] !== 'finale' && b[0] !== 'stage') g.append(el('line', { x1: W / 2 - h0 + 4, y1: y0 + 1, x2: W / 2 + h0 - 4, y2: y0 + 1, stroke: 'rgba(255,255,255,0.25)', 'stroke-width': 1.5 }));
        const cls = b[0] === 'stage' ? 'pyr-stage' : b[0] === 'finale' ? 'pyr-finale' : 'pyr-label';
        const fs = b[0] === 'finale' ? 52 : b[0] === 'stage' ? 30 : 26;
        const ty = b[0] === 'finale' ? y1 - hgt * 0.22 : (y0 + y1) / 2 + fs * 0.36;
        g.append(el('text', { x: W / 2, y: ty, 'text-anchor': 'middle', class: cls, 'font-size': fs }, b[1]));
        // Gewinnstufen mit der Münze der Show markieren.
        if (b[0] === 'stage') {
          const cs = 54;
          // nur rechts neben der Pyramide
          g.append(el('image', { href: 'assets/img/muenze.webp', x: W / 2 + h1 + 14 - cs / 2, y: (y0 + y1) / 2 - cs * 0.43, width: cs, height: cs * 0.87, class: 'pyr-coin' }));
        }
        if (num && s.games) {
          const gm = s.games[Number(num[1]) - 1];
          if (gm) g.append(el('title', {}, gm.title));
        }
        order.unshift(g);
        svg.append(g);
        y = y1 + gap * scale;
      });
      // Von unten nach oben einblenden.
      order.forEach((g, i) => { g.style.animationDelay = `${i * 0.12}s`; });
      return [h('div', { class: 'pyr-wrap' }, svg)];
    }

    // Spieltitel: Fernseher mit Kachelschrift „KATEGORIE n“ und großem Titel.
    // Jedes Spiel (Position 1–8) bekommt eine eigene Farbe.
    const GAME_COLORS = ['#ff8a7a', '#3fd3ea', '#ff63b1', '#f4b740', '#ab8dff', '#4fdca4', '#ff9d45', '#7fb0ff'];
    function titleCard(s, opts = {}) {
      const pos = s.game.position;
      const label = `Kategorie ${pos}`;
      const color = GAME_COLORS[(pos - 1) % GAME_COLORS.length];
      const line = Array(14).fill(label).join(' ');
      const tiles = h('div', { class: 'tv-tiles', 'aria-hidden': 'true' },
        Array.from({ length: 10 }, (_, i) => h('div', { class: i % 3 === 1 ? 'ghost' : '' }, `${line} ${line}`)));
      // Buchstaben einzeln animieren, aber je Wort zusammenhalten: Umbruch nur zwischen Wörtern.
      let n = 0;
      const words = s.game.title.split(/\s+/).filter(Boolean).map((w) =>
        h('span', { class: 'word' }, [...w].map((ch) => h('span', { style: { animationDelay: `${0.3 + n++ * 0.04}s` } }, ch))));
      const title = h('div', { class: 'tv-title', 'aria-label': s.game.title });
      words.forEach((w, i) => { if (i) title.append(' '); title.append(w); });
      return h('div', { class: `tv${opts.compact ? ' compact' : ''}`, '--tv': color },
        h('div', { class: 'tv-screen' }, tiles,
          h('div', { class: 'tv-plate' }, h('span', { class: 'tv-num' }, label), title)));
    }

    function title(s) {
      return [titleCard(s)];
    }

    function game(s) {
      const v = s.gameView;
      if (!v) return start(s);
      if (v.waiting && v.type !== 'land') return [titleCard(s, { compact: true })];
      return renderGame(v, s, (id) => teamOf(s, id));
    }

    // Rangliste von unten nach oben aufbauen: der letzte Platz erscheint zuerst.
    function ranking(s) {
      const list = s.ranking || [];
      return [
        h('div', { class: 'mega', style: { fontSize: 'clamp(1rem,min(6vw,12vh),6rem)', marginBottom: '4vh' } }, 'Zwischenstand'),
        h('ol', { class: 'rank' }, list.map((r, i) => h('li', { '--team': r.color, style: { animationDelay: `${(list.length - 1 - i) * 0.6}s` } },
          h('span', {}, `${i + 1}.`), h('span', {}, r.name), h('span', { class: 'pts' }, r.points)))),
      ];
    }

    // Intro-Video der Show, bildschirmfüllend. Ohne Video (oder am Ende) das Logo.
    // Ton nur auf dem echten Beamer nach „Ton aktivieren“, die Vorschau bleibt stumm.
    function video(s) {
      const box = h('div', { class: 'video-stage' });
      const logo = () => box.replaceChildren(h('div', { class: 'video-end' }, ...start(s)));
      if (!s.introVideo) { logo(); return [box]; }
      const v = h('video', { class: 'intro-video', playsinline: true, preload: 'auto' });
      v.muted = embedded || !audio;
      v.onended = logo;
      box.append(v);
      mediaUrl(s.introVideo.id).then((url) => {
        if (!url) return logo();
        v.src = url;
        v.currentTime = 0;
        v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
      });
      return [box];
    }

    // ---------- Finale gegen die Moderation ----------
    // Animationen nur für das, was sich gerade geändert hat (sonst würden sie bei jedem Update neu starten).
    let prevFin = null;
    function finale(s) {
      const f = s.finale;
      if (!f) return [showLogo(s.show.name)];
      const p = prevFin && prevFin.qIndex === f.qIndex ? prevFin : null;
      const pr = p && p.round ? p.round : {};
      const r = f.round;
      const isNew = {
        start: !prevFin,
        question: !p || !pr.question,
        teamAnswered: r && r.teamAnswered && !pr.teamAnswered,
        modAnswered: r && r.modAnswered && !pr.modAnswered,
        teamGrade: r && r.teamGrade !== null && pr.teamGrade !== r.teamGrade,
        challenge: r && r.challenged && !pr.challenged,
        modGrade: r && r.modGrade !== null && pr.modGrade !== r.modGrade,
        resolved: r && r.resolved && !pr.resolved,
        sudden: f.sudden && !(prevFin && prevFin.sudden),
        result: f.result && !(prevFin && prevFin.result),
      };
      prevFin = f;
      const an = (cond, cls) => (cond ? ` ${cls}` : '');

      const top = h('div', { class: 'fb-top' },
        h('div', { class: `fb-title${an(isNew.start, 'enter')}` }, '★ FINALE ★'),
        f.sudden ? h('div', { class: `fb-sudden${an(isNew.sudden, 'enter')}` }, 'SUDDEN DEATH') : h('div', { class: 'fb-sub' }, `Wer zuerst ${f.target} Punkte hat, gewinnt`));

      if (f.result) {
        const won = f.result === 'team';
        const conf = h('div', { class: 'fb-confetti', 'aria-hidden': 'true' }, won ? Array.from({ length: 70 }, (_, i) => h('i', { style: { left: `${(i * 37) % 100}%`, animationDelay: `${(i % 14) * 0.18}s`, background: ['#ffc23d', '#ff2d8a', '#1fd6f2', '#fff'][i % 4], '--rot': `${(i * 53) % 360}deg` } })) : []);
        return [h('div', { class: `fb-stage result ${won ? 'won' : 'lost'}` }, conf, top,
          h('div', { class: 'fb-result' },
            won ? h('div', { class: 'fb-winner', '--team': f.team.color }, h('span', {}, f.team.name), h('b', {}, 'STIEHLT DIE SHOW!'))
                : h('div', { class: 'fb-winner mod' }, h('span', {}, f.host || 'Die Moderation'), h('b', {}, 'BEHÄLT DIE SHOW!')),
            won ? h('div', { class: 'fb-ticket' }, h('div', { class: 'fb-ticket-l' }, h('small', {}, 'TICKET'), h('b', {}, 'Die große Finalshow'), h('span', {}, f.team.name)), h('div', { class: 'fb-ticket-r' }, coinImg('fb-ticket-coin'), h('small', {}, 'ADMIT ONE')))
                : h('div', { class: 'fb-sub' }, `Endstand ${f.score.team} : ${f.score.mod}`)))];
      }

      // Layout wie im TV-Finale: in der Mitte das Moderationspult mit der Co-Moderation,
      // links das Pult des Teams, rechts das Pult der Moderation (je mit 3D-Avatar),
      // darunter die schwarzen Antworttafeln, dazwischen die Frage. Punkte = Dreiecke.
      const tris = (n, cls) => h('div', { class: `fx-tris ${cls}` }, Array.from({ length: f.target }, (_, i) =>
        h('span', { class: `fx-tri${i < n ? ' on' : ''}${an(isNew.resolved && i === n - 1 && (cls === 'team' ? r.teamPoint : r.modPoint), 'new')}` })));
      const stamp = (g, isn) => (g === null || g === undefined ? null : h('div', { class: `fb-stamp ${g ? 'ok' : 'bad'}${an(isn, 'enter')}` }, g ? '✓' : '✗'));
      const waitDots = () => h('span', { class: 'fb-dots' }, h('i'), h('i'), h('i'));
      const inPlay = !!(r && r.challenged && !r.resolved);
      const lostCount = f.coinsTotal - f.coins;
      const avail = f.coins - (inPlay ? 1 : 0);
      const teamBoard = !r ? h('div', { class: 'fx-board-body idle' }, h('span', { class: 'fx-big' }, '?'))
        : r.teamAnswer ? h('div', { class: 'fx-board-body' }, answerContent(r.teamAnswer, 'fx-ink'))
        : h('div', { class: 'fx-board-body' }, r.teamAnswered ? h('span', { class: 'fx-locked' }, '🔒 abgegeben') : waitDots());
      const flipped = !!(r && r.challenged && r.modAnswer);
      const modBoard = h('div', { class: `fx-flip${flipped ? ' flipped' : ''}${an(isNew.challenge, 'go')}` },
        h('div', { class: 'fx-face back' }, !r ? h('span', { class: 'fx-big' }, '?') : r.modAnswered ? [h('span', { class: 'fx-big' }, '?'), h('small', {}, 'verdeckt')] : waitDots()),
        h('div', { class: 'fx-face front' }, flipped ? answerContent(r.modAnswer, 'fx-ink') : null));
      // Münzen des Teams: verfügbar, gerade im Einsatz (Platzhalter), verloren (leerer Platz)
      const coinRow = h('div', { class: 'fx-coins' }, f.coinsTotal
        ? Array.from({ length: f.coinsTotal }, (_, i) => i < avail ? coinImg('fx-coin') : i < avail + (inPlay ? 1 : 0) ? coinImg('fx-coin used') : h('span', { class: 'fx-coin-slot' }))
        : h('span', { class: 'fx-nocoin' }, 'keine Münze'));
      const hostAvatar = s.show.hostAvatar || 'assets/img/avatar-host.webp';
      const side = (who, name, color, board, score, grade, isn, podium) => h('div', { class: `fx-side ${who}${an(isNew.start, 'enter')}`, '--side': color },
        podium,
        h('div', { class: `fx-board${an(who === 'team' ? isNew.teamAnswered : isNew.modAnswered, 'pop')}` }, board, stamp(grade, isn)),
        h('div', { class: 'fx-name' }, name),
        tris(Math.min(score, f.target), who));
      const question = !r
        ? h('div', { class: 'fx-q' }, h('span', {}, `${f.team.name} gegen ${f.host || 'die Moderation'}`), h('b', {}, `Wer zuerst ${f.target} Punkte hat, gewinnt`))
        : h('div', { class: `fx-q${an(isNew.question, 'enter')}` }, h('span', {}, r.question),
          r.resolved ? h('b', { class: an(isNew.resolved, 'enter').trim() }, r.solution || '–') : null,
          r.resolved && r.challenged ? h('em', { class: r.coinLost ? 'bad' : 'ok' }, r.coinLost ? 'Münze verloren' : 'Münze zurück · kein Punkt für die Moderation') : null);
      // Münzfeld auf der Pultfront: verlorene Münzen bleiben liegen, die eingesetzte glänzt.
      const deskCoins = [];
      for (let i = 0; i < lostCount; i++) deskCoins.push(coinImg(`fx-desk-coin${an(isNew.resolved && r.coinLost && i === lostCount - 1, 'target')}`));
      if (inPlay) deskCoins.push(coinImg(`fx-desk-coin inplay${an(isNew.challenge, 'target')}`));
      const { W: PW, H: PH, pc } = PULT;
      const pult = h('div', { class: 'fx-pultwrap' }, h('div', { class: 'scene fx-pult' },
        ...pultLayers(s.show, 'cohost'),
        h('div', { class: 'fx-field', style: { left: pc(372, PW), top: pc(316, PH), width: pc(130, PW), height: pc(72, PH) } },
          h('span', { class: 'fx-glitch' }, 'FINALE'), h('div', { class: 'fx-field-coins' }, deskCoins))));
      const out = [h('div', { class: 'fb-stage fx' },
        h('div', { class: 'fx-top' }, f.sudden ? h('div', { class: `fb-sudden${an(isNew.sudden, 'enter')}` }, 'SUDDEN DEATH') : null),
        h('div', { class: 'fx-bottom' },
          side('team', f.team.name, f.team.color, teamBoard, f.score.team, r ? r.teamGrade : null, isNew.teamGrade,
            singlePodium({ avatar: f.team.avatar, color: f.team.color, label: `Pult ${f.team.name}`, extra: coinRow })),
          h('div', { class: 'fx-mid' }, pult, question),
          side('mod', f.host || 'Moderation', '#7fc8bd', modBoard, f.score.mod, r ? r.modGrade : null, isNew.modGrade,
            singlePodium({ mirror: true, avatar: hostAvatar, color: '#7fc8bd', label: `Pult ${f.host || 'Moderation'}` }))))];
      // Münzflug: Einsatz → vom Team auf das Pult; zurück → vom Pult zum Team.
      if (isNew.challenge || (isNew.resolved && r.challenged && !r.coinLost)) {
        setTimeout(() => {
          const team = document.querySelector('.fx-coins .fx-coin.used') || [...document.querySelectorAll('.fx-coins .fx-coin')].pop();
          const desk = document.querySelector('.fx-desk-coin.target') || document.querySelector('.fx-field-coins');
          if (isNew.challenge) flyCoin(team, desk);
          else {
            const back = [...document.querySelectorAll('.fx-coins .fx-coin')].pop();
            flyCoin(document.querySelector('.fx-field-coins'), back);
          }
        }, 60);
      }
      return out;
    }

    // Münze von einem Element zum anderen fliegen lassen (drehend, im Bogen).
    function flyCoin(from, to) {
      if (!from || !to || document.documentElement.classList.contains('reduced-motion')) return;
      const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
      const size = Math.max(a.width, 40);
      const img = coinImg('fx-flying');
      Object.assign(img.style, { position: 'fixed', left: `${a.left + a.width / 2 - size / 2}px`, top: `${a.top + a.height / 2 - size / 2}px`, width: `${size}px`, zIndex: 50 });
      document.body.append(img);
      to.style.opacity = '0';
      const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
      const end = Math.max(0.4, Math.min(2, (b.width || size) / size));
      const speed = Number(getComputedStyle(document.documentElement).getPropertyValue('--speed')) || 1;
      img.animate([
        { transform: 'translate(0, 0) scale(1) rotateY(0deg)' },
        { offset: 0.55, transform: `translate(${dx * 0.55}px, ${dy * 0.55 - window.innerHeight * 0.25}px) scale(2.4) rotateY(900deg)` },
        { transform: `translate(${dx}px, ${dy}px) scale(${end}) rotateY(1440deg)` },
      ], { duration: 1500 * speed, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' }).onfinish = () => {
        img.remove();
        to.style.opacity = '';
        to.classList.add('landed');
      };
    }

    // Pause: Moderationspult, dahinter die Live-Band im Takt der Pausenmusik.
    // Ton nur auf dem echten Beamer, wenn er aktiviert und erlaubt ist.
    function pause(s) {
      // Eigene Lieder der Pause (aus dem Show-Editor), sonst der eingebaute Song.
      startPause(!embedded && s.settings.sound && audioReady(audio) ? audio : null, s.pauseSongs || []);
      return [bandScene(Math.max(0, 3 - (s.coins || []).length))];
    }

    // Münze / Gewinnstufe: erst das Moderationspult mit der Stufe auf dem Bildschirm,
    // dann werden die Teampulte mit den aktuellen Punkten wieder eingeblendet.
    function coin(s) {
      const t = teamOf(s, s.coin.teamId);
      const stage = STAGE_OF[s.coin.position];
      const W = 938, H = 530, scr = [389, 34, 547, 157];
      // Münzen auf dem Pult vor dieser Vergabe: 3 minus die schon vergebenen.
      const left = Math.max(1, 3 - (s.coins || []).filter((c) => c.position < s.coin.position).length);
      const pct = (v, total) => `${(v / total) * 100}%`;
      const pult = h('div', { class: 'scene scene-pult full' },
        ...pultLayers(s.show, 'both'),
        h('div', { class: 'overlay', style: { left: pct(scr[0], W), top: pct(scr[1], H), width: pct(scr[2] - scr[0] + 1, W), height: pct(scr[3] - scr[1] + 1, H) } },
          stage ? [h('small', {}, 'Gewinnstufe'), h('b', {}, String(stage))] : [h('small', {}, 'Münze nach Spiel'), h('b', {}, String(s.coin.position))]),
        // Noch nicht vergebene Münzen stehen auf dem Pult; die rechte davon hebt ab
        // und wird zur großen Münze, die anschließend zum Gewinnerteam fliegt.
        PULT_COINS.slice(0, left).map(([cx, cy], i) => h('img', {
          class: `pult-coin${i === left - 1 ? ' lift' : ''}`, src: 'assets/img/muenze.webp', alt: '', 'aria-hidden': 'true',
          style: { left: pct(cx - 16.5, W), top: pct(cy - 14.5, H), width: pct(33, W) },
        })),
        h('img', { class: 'scene-coin from-pult', src: 'assets/img/muenze.webp', alt: '', 'aria-hidden': 'true' }));
      const wrap = h('div', {}, pult); // ohne Animation, sonst wäre das Vollbild-Pult darin gefangen
      const showTeams = () => {
        wrap.className = 'coin-sequence';
        wrap.replaceChildren(
          h('div', { class: 'kicker' }, stage ? `Gewinnstufe ${stage} · Zwischenstand` : 'Zwischenstand'),
          h('div', { class: 'coin-teams' },
            teamsScene(s, { points: true, winnerId: t.id, flyPosition: s.coin.position, banner: h('div', { class: 'scene-banner', '--team': t.color }, coinImg('banner-coin'), ` Münze an ${t.name}`) })));
      };
      if (s.settings.reducedMotion) showTeams();
      else titleTimer = setTimeout(showTeams, 7600 * (Number(getComputedStyle(document.documentElement).getPropertyValue('--speed')) || 1));
      return [wrap];
    }
  </script>
