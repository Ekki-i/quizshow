<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wer stiehlt uns die Show – Show-Regie</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="mod-top">
    <div class="logo"><span class="logo-text" id="show-name">Show-Regie</span></div>
    <!-- Hauptpunkte; „Editor“ bündelt Teams, Show-Editor und Spiele-Datenbank als Unterpunkte.
         Mit ?view=live nur die Moderation, mit ?view=editor nur der Editor (Prototyp-Reiter). -->
    <nav class="tabs" role="tablist" id="main-tabs" aria-label="Bereiche">
      <button role="tab" data-tab="live" aria-selected="true">Live-Regie</button>
      <button role="tab" data-group="editor" aria-selected="false">Editor</button>
    </nav>
    <nav class="tabs sub-tabs hidden" role="tablist" id="editor-tabs" aria-label="Editor">
      <button role="tab" data-tab="editor" aria-selected="false">Show-Editor</button>
      <button role="tab" data-tab="library" aria-selected="false">Spiele-Datenbank</button>
    </nav>
    <div class="row">
      <a class="btn small ghost" href="beamer.html" target="_blank" rel="noopener" title="Beamer-Ansicht in neuem Fenster – dort „⛶ Vollbild“">Beamer öffnen ↗</a>
      <a class="btn small ghost" href="host.html" target="_blank" rel="noopener" title="Antwort-iPad der Moderation fürs Finale. Auf dem iPad: Startseite → Passwort → „Als iPad Moderation (Finale) anmelden“">iPad Moderation (Finale) ↗</a>
      <button class="btn small ghost" id="logout">Abmelden</button>
    </div>
  </header>
  <main class="mod-main">
    <div id="warning"></div>
    <section id="tab-live" role="tabpanel">
      <div id="run-panel"></div>
      <!-- Kleine Beamer-Vorschau direkt unter dem Showablauf (fest im HTML, lädt bei Updates nicht neu) -->
      <section class="card beamer-mini" aria-label="Beamer-Vorschau">
        <iframe class="preview" src="beamer.html?preview" title="Beamer-Vorschau"></iframe>
        <div class="beamer-mini-info">
          <h3>Beamer</h3>
          <div id="beamer-controls"></div>
        </div>
      </section>
      <div class="live-grid">
        <div id="live-left" class="grid" style="align-content:start"></div>
        <div class="grid" style="align-content:start">
          <div id="live-right" class="grid"></div>
        </div>
      </div>
      <!-- Spiele direkt aktivieren: ganz unten, nur für Ausnahmen neben dem Showablauf -->
      <div id="live-bottom" class="grid" style="margin-top:16px"></div>
    </section>
    <section id="tab-teams" role="tabpanel" class="hidden"></section>
    <section id="tab-editor" role="tabpanel" class="hidden"></section>
    <section id="tab-library" role="tabpanel" class="hidden"></section>
    <section id="tab-points" role="tabpanel" class="hidden"></section>
  </main>

  <script type="module" src="assets/js/moderator.js"></script>
</body>
</html>
