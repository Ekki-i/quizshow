<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wer stiehlt uns die Show – Team</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="team-head" id="head">
    <span class="name" id="team-name">Team</span>
    <span class="muted" id="game-name"></span>
  </header>
  <main class="team-main" id="main">
    <div class="wait"><p class="big">Verbinde …</p></div>
  </main>

  <script type="module">
    import { h, connect, store, localServer, setShowTitle } from './assets/js/client.js';
    import { syncTimer } from './assets/js/timer-ui.js';
    import { renderPlay, renderFinale } from './assets/js/team-play.js';

    const params = new URLSearchParams(location.search);
    const urlCode = params.get('code');
    if (urlCode) {
      store('quiz.teamCode', urlCode.trim().toUpperCase());
      // Code aus der Adresszeile entfernen, damit er nicht versehentlich geteilt wird.
      // Im Prototyp laufen mehrere Teams in einem Browser, dort bleibt er in der Adresse.
      if (!localServer) history.replaceState(null, '', 'team.html');
    }
    const code = urlCode?.trim().toUpperCase() || store('quiz.teamCode');
    const expect = params.get('expect');
    const main = document.getElementById('main');
    if (!code) location.href = 'index.html';

    // Entwurf der Freitextantwort lokal halten, damit Neuladen nichts löscht.
    let draftKey = null;
    let lastRenderKey = null;

    let clockOffset = 0;
    const conn = connect({
      hello: () => ({ role: 'team', code }),
      onState: (s, serverTime) => {
        if (serverTime) clockOffset = serverTime - Date.now();
        render(s);
      },
      onAuthFailed: (m) => leave(m),
      onKicked: (m) => leave(m),
    });

    function leave(message) {
      store('quiz.teamCode', null);
      main.replaceChildren(h('div', { class: 'wait' },
        h('p', { class: 'big' }, message || 'Abgemeldet'),
        h('p', {}, h('a', { class: 'btn', href: 'index.html' }, 'Zur Startseite'))));
    }

    function render(s) {
      document.documentElement.classList.toggle('reduced-motion', !!s.settings.reducedMotion);
      document.title = `${s.team.name} – ${s.show.name}`;
      document.getElementById('team-name').textContent = s.team.name;
      document.getElementById('head').style.setProperty('--team', s.team.color);
      const gameName = document.getElementById('game-name');
      if (s.game) { gameName.classList.remove('show-title'); gameName.textContent = `Spiel ${s.game.position}: ${s.game.title}`; }
      else setShowTitle(gameName, s.show.name);

      const parts = [];
      if (expect && expect !== s.team.id) {
        parts.push(h('p', { class: 'notice warn', role: 'alert' }, `Achtung: Dieser Code gehört zu „${s.team.name}“.`));
      }
      const teamOf = (id) => s.teams.find((t) => t.id === id);
      const ui = {
        conn,
        team: s.team,
        teams: s.teams,
        teamName: (id) => teamOf(id)?.name || '?',
        teamColor: (id) => teamOf(id)?.color || '#888',
        setDraft: (k) => (draftKey = k),
        clearDraft: () => store(draftKey, null),
      };
      draftKey = null;
      if (s.play) parts.push(...renderPlay(s.play, ui).filter(Boolean));
      else if (s.finale) parts.push(...renderFinale(s.finale, ui).filter(Boolean));
      else if (s.waitKind === 'pause') parts.push(h('div', { class: 'wait' },
        h('p', { class: 'big' }, 'Pause – gleich geht’s weiter!'),
        h('p', { class: 'muted' }, 'Dieses Gerät bleibt mit eurem Team verbunden.')));
      else parts.push(h('div', { class: 'wait' },
        h('p', { class: 'big' }, 'Gleich geht’s los!'),
        h('p', { class: 'muted' }, 'Wartet auf die Moderation. Dieses Gerät bleibt mit eurem Team verbunden.')));
      if (s.ranking) {
        parts.push(h('section', { class: 'card', style: { marginTop: '24px' } }, h('h3', {}, 'Punktestand'),
          h('ul', { class: 'list' }, s.ranking.map((r) => h('li', {}, h('span', { class: 'dot', style: { background: r.color } }), h('span', { class: 'grow' }, r.name), h('b', {}, r.points))))));
      }

      // 10-Sekunden-Timer: Anzeige oben; bei Ablauf wird jedes beschriebene Feld automatisch abgeschickt.
      syncTimer(s.play ? s.timer || null : null, 'team', {
        onLock: () => document.querySelectorAll('#main .ink').forEach((el) => el.inkApi?.autoSubmit?.()),
      });

      // Ein offenes Eingabefeld nicht bei jedem Update neu aufbauen (Fokus/Tastatur bleiben).
      const key = JSON.stringify([s.team, s.teams, s.game, s.play || null, s.finale || null, s.ranking || null, s.waitKind || null]);
      if (key === lastRenderKey) return;
      lastRenderKey = key;
      main.replaceChildren(...parts);
      const box = document.getElementById('answer');
      if (box) {
        box.value = store(draftKey) || '';
        box.addEventListener('input', () => store(draftKey, box.value));
      }
    }

    // Countdowns (z. B. 10-Sekunden-Fenster) laufen nach der Server-Uhr.
    setInterval(() => {
      for (const el of document.querySelectorAll('[data-deadline]')) {
        const left = Math.max(0, Math.ceil((Number(el.dataset.deadline) - (Date.now() + clockOffset)) / 1000));
        el.textContent = `${left} s`;
      }
    }, 250);
  </script>
</body>
</html>
